  <rect x="22" y="48" width="84" height="36" rx="18" fill="#000000" opacity="0.12" transform="translate(0 4)"/>
  <rect x="22" y="46" width="84" height="36" rx="18" fill="url(#glass)"/>
  <rect x="23" y="47" width="82" height="34" rx="17" fill="none" stroke="url(#rim)" stroke-width="2"/>
  <circle cx="44" cy="64" r="5" fill="#ffffff"/>
  <circle cx="64" cy="64" r="5" fill="#ffffff"/>
  <circle cx="84" cy="64" r="5" fill="#ffffff"/>
