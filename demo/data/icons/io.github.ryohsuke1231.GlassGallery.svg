<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f25a73"/>
      <stop offset="0.35" stop-color="#fac940"/>
      <stop offset="0.65" stop-color="#40bfa6"/>
      <stop offset="1" stop-color="#4059e6"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="8" y="8" width="112" height="112" rx="26"/>
    </clipPath>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
